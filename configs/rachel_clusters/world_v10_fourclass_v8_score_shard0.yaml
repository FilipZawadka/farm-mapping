# ============================================================================
# world_v10_fourclass_v8_score_shard0 -- inference-only shard 1/6 of a full scoring pass.
#
# GENERATED by scripts/make_inference_shards.py -- do not hand-edit; regenerate.
# Scores the checkpoint trained by world_v10_fourclass_v8.yaml over every candidate we
# have, including rows training drops (Ambiguous + Mixed/Other/Unknown/
# PigsOrPoultry -> label=-1, scored but never trained on) and all unlabeled
# rest-of-world rows.
#
# This shard: 1 countries, ~35,867 candidates.
# Run with:  --steps inference   (candidates step runs ONCE, separately --
# convert() writes ALL country CSVs, so concurrent shards would race on it.)
# ============================================================================
run_name: world_v10_fourclass_v8_score_shard0
data:
  candidates_dir: data/rachel_geometry_candidates/candidates_world_v10_v8_scoreall
  parquet_source: data/rachel_geometry_candidates/all_countries/all_clusters_v8.parquet
  inspected_as_test: true
  include_unlabeled: true
  label_mode: four_class
  training_countries:
  - USA
  - BRA
  - CHL
  - MEX
  - THA
  generalization_countries:
  - BGD
  - NGA
  - ALB
  - COD
  dmv_force_to_train_only: true
  countries:
  - united_states
  keep_unscorable_labels: true
patches:
  patch_size_px: 128
  resolution_m: 10
  bands:
  - B2
  - B3
  - B4
  - B8
  - B11
  - B12
  indices:
  - NDVI
  - NDBI
  - NDWI
  composite: median
  date_range:
  - '2023-01-01'
  - '2023-12-31'
  max_cloud_cover: 15
  output_dir: data/patches
  num_workers: 16
model:
  architecture: resnet50_softcon
  hub_name: SENTINEL2_ALL_SOFTCON
  pretrained_band_order:
  - B1
  - B2
  - B3
  - B4
  - B5
  - B6
  - B7
  - B8
  - B8A
  - B9
  - B10
  - B11
  - B12
  pretrained: true
  num_classes: 4
  input_channels: 9
  freeze_backbone_epochs: 5
  class_names:
  - NotFarm
  - Poultry
  - Pigs
  - Cattle
  class_colors:
  - '#95a5a6'
  - '#e74c3c'
  - '#3498db'
  - '#27ae60'
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 10
  checkpoint_metric: val_f1
  normalization: per_channel
  dataloader_workers: 8
  val_split: 0.15
  test_split: 0.15
  seed: 42
  mixed_precision: true
  upsample_minority_regions: false
  balanced_country_splits: false
  balanced_class_sampling: false
  class_weight: null
  channel_subset: null
  crop_center_px: 64
  augmentation:
    enabled: true
    horizontal_flip:
      enabled: true
      probability: 0.5
    vertical_flip:
      enabled: true
      probability: 0.5
    random_rotation_90:
      enabled: true
      probability: 0.75
    continuous_rotation:
      enabled: true
      probability: 0.3
      max_degrees: 15
    random_resized_crop:
      enabled: true
      probability: 0.3
      scale_min: 0.8
      scale_max: 1.0
    brightness_jitter:
      enabled: true
      probability: 0.5
      range_min: 0.85
      range_max: 1.15
    per_band_jitter:
      enabled: true
      probability: 0.3
      range_min: 0.95
      range_max: 1.05
    gaussian_noise:
      enabled: true
      probability: 0.3
      sigma: 0.02
    channel_dropout:
      enabled: true
      probability: 0.1
      max_channels: 1
    cutout:
      enabled: false
    recompute_indices: false
mlflow:
  tracking_uri: ./mlruns
  experiment_name: world_v10_fourclass_v8_score_shard0
  log_model: true
runpod:
  gpu_type: NVIDIA A40
  gpu_fallbacks:
  - NVIDIA L4
  - NVIDIA L40
  - NVIDIA L40S
  - NVIDIA RTX A5000
  - NVIDIA RTX A6000
  - NVIDIA RTX 6000 Ada Generation
  - NVIDIA GeForce RTX 4090
  cloud_type: SECURE
  docker_image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  volume_mount: /workspace
  code_dir: /workspace/farm-mapping
  github_repo: https://github.com/FilipZawadka/farm-mapping.git
  github_branch: more_cnn_tests
  api_key_env: RUNPOD_API_KEY
  network_volume_id: r8nyom4e4e
  cpu_instance_id: cpu3g-8-32
  cpu_fallbacks:
  - cpu3g-4-16
  - cpu3c-8-16
  - cpu3m-4-32
  auto_terminate: true
inference:
  checkpoint: data/output/world_v10_fourclass_v8/best_model.pt
  threshold: 0.5
  labeled_only: false
  confidence_tiers:
    high: 0.9
    medium: 0.7
    low: 0.4
  norm_stats_stem: world_v10_fourclass_v8
  batch_size: 256
  num_workers: 8
  mixed_precision: true
visualization:
  output_dir: output/maps_world_v10_fourclass_v8_score_shard0
  show_true_positives: true
  show_false_positives: true
  show_false_negatives: true
  show_true_negatives: true
