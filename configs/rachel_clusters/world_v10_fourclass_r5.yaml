# Round 5 anchor -- arm A on Rachel's round_5 files: byte-identical v9/v6/round_4 recipe,
# NO sampler. The control for the round_5 balancing arms (world_v10_fourclass_r5_{g,h,i}_s44).
#
# What round_5 changes vs round_4 (Rachel, 2026-09-09/10):
#   * ~30 bad labels corrected (from the round_2 false-positive review) in the for_analysis files
#   * label-group definitions made consistent when building evaluation sets (eval changes a bit)
#   * every BGD cluster is split=generalization; three new fully held-out generalization
#     countries: PER, IDN, MOZ (do NOT use them for model selection or thresholds)
#   * eval clusters that had dropped out for lack of a valid Sentinel patch are restored
#   * SPLIT-LEVEL CAP: high-income countries may contribute at most 1.3x the LMIC total in the
#     Poultry and NotFarm classes; per-country ceilings for HICs (NotFarm 789: DEU 879->789,
#     RUS 2960->789, USA 2096->789; Poultry 1205: USA 6377->1205); Pigs/Cattle uncapped.
#     20,435 of 29,175 eligible clusters kept; the excluded rows carry split=qual_eval.
#     train/val/test proportions unchanged for the focal countries, other countries 80:20
#     train/val -- so the TEST set differs from round_4 and test numbers are not comparable
#     across rounds. generalization and eval membership are preserved.
# Data: all_clusters_v11.parquet = merge of {ISO}_selected_clusters_round_5.parquet
#       (scripts/merge_clusters_v7.py --pattern '*_selected_clusters_round_5.parquet'),
#       candidates dir candidates_world_v10_r5 (built by the candidates step of THIS config).
# generalization_countries / training_countries are inert on the explicit-split path
# (cnn_split_assigned is the source of truth) and listed for documentation only.
# runpod.github_branch=develop: the sampler code lives there.

run_name: world_v10_fourclass_r5
data:
  candidates_dir: data/rachel_geometry_candidates/candidates_world_v10_r5
  parquet_source: data/rachel_geometry_candidates/all_countries/all_clusters_v11.parquet
  inspected_as_test: true
  include_unlabeled: true
  label_mode: four_class
  training_countries:
  - USA
  - BRA
  - CHL
  - MEX
  - THA
  generalization_countries:
  - BGD
  - NGA
  - ALB
  - COD
  - IND
  - MAR
  - PER
  - IDN
  - MOZ
  dmv_force_to_train_only: true
patches:
  patch_size_px: 128
  resolution_m: 10
  bands:
  - B2
  - B3
  - B4
  - B8
  - B11
  - B12
  indices:
  - NDVI
  - NDBI
  - NDWI
  composite: median
  date_range:
  - '2023-01-01'
  - '2023-12-31'
  max_cloud_cover: 15
  output_dir: data/patches
  num_workers: 16
model:
  architecture: resnet50_softcon
  hub_name: SENTINEL2_ALL_SOFTCON
  pretrained_band_order:
  - B1
  - B2
  - B3
  - B4
  - B5
  - B6
  - B7
  - B8
  - B8A
  - B9
  - B10
  - B11
  - B12
  pretrained: true
  num_classes: 4
  input_channels: 9
  freeze_backbone_epochs: 5
  class_names:
  - NotFarm
  - Poultry
  - Pigs
  - Cattle
  class_colors:
  - '#95a5a6'
  - '#e74c3c'
  - '#3498db'
  - '#27ae60'
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 10
  checkpoint_metric: val_f1
  normalization: per_channel
  dataloader_workers: 8
  val_split: 0.15
  test_split: 0.15
  seed: 42
  mixed_precision: true
  upsample_minority_regions: false
  balanced_country_splits: false
  balanced_class_sampling: false
  class_weight: null
  channel_subset: null
  crop_center_px: 64
  augmentation:
    enabled: true
    horizontal_flip:
      enabled: true
      probability: 0.5
    vertical_flip:
      enabled: true
      probability: 0.5
    random_rotation_90:
      enabled: true
      probability: 0.75
    continuous_rotation:
      enabled: true
      probability: 0.3
      max_degrees: 15
    random_resized_crop:
      enabled: true
      probability: 0.3
      scale_min: 0.8
      scale_max: 1.0
    brightness_jitter:
      enabled: true
      probability: 0.5
      range_min: 0.85
      range_max: 1.15
    per_band_jitter:
      enabled: true
      probability: 0.3
      range_min: 0.95
      range_max: 1.05
    gaussian_noise:
      enabled: true
      probability: 0.3
      sigma: 0.02
    channel_dropout:
      enabled: true
      probability: 0.1
      max_channels: 1
    cutout:
      enabled: false
    recompute_indices: false
mlflow:
  tracking_uri: ./mlruns
  experiment_name: world_v10_fourclass_softcon
  log_model: true
runpod:
  gpu_type: NVIDIA GeForce RTX 4090
  gpu_fallbacks:
  - NVIDIA L4
  cloud_type: SECURE
  docker_image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  volume_mount: /workspace
  code_dir: /workspace/farm-mapping
  github_repo: https://github.com/FilipZawadka/farm-mapping.git
  github_branch: develop
  api_key_env: RUNPOD_API_KEY
  network_volume_id: r8nyom4e4e
  cpu_instance_id: cpu3g-8-32
  cpu_fallbacks:
  - cpu3g-4-16
  - cpu3c-8-16
  - cpu3m-4-32
  auto_terminate: true
inference:
  threshold: 0.5
  labeled_only: true
  confidence_tiers:
    high: 0.9
    medium: 0.7
    low: 0.4
visualization:
  output_dir: output/maps_world_v10_fourclass_softcon
  show_true_positives: true
  show_false_positives: true
  show_false_negatives: true
  show_true_negatives: true
