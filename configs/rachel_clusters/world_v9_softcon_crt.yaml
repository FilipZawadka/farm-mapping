# ============================================================================
# world_v9_softcon_crt -- stage-2 classifier retraining (cRT, Kang et al.
# 2020) on top of the world_v9_softcon checkpoint.
#
# world_v9_softcon won on eval: best eval macroF1 (0.504) AND best eval
# OtherFarm F1 (0.300) in the whole log, but its generalization (0.402)
# trailed v8_crt (0.426). cRT bought v8_ssl4eo a clean gen lift for free
# (0.407 -> 0.426) with no eval-OtherFarm damage; this run applies the same
# recipe to the SoftCon backbone. Goal: keep softcon's eval-OtherFarm edge
# while recovering the ~0.42 generalization that head-rebalancing buys.
#
# Recipe (identical to world_v8_crt except the backbone we resume from):
#   1. world_v9_softcon trained with NATURAL sampling and wrote
#      data/output/world_v9_softcon/best_model.pt
#   2. this config warm-starts from it, freezes the backbone for ALL epochs
#      (freeze_backbone_epochs > epochs), and retrains ONLY the head with
#      class-balanced sampling.
#
# Comparability: data/patches/candidates_dir/runpod byte-identical to the v8
# and v9 runs (same imagery hash + seed 42 => identical split membership), so
# metrics drop straight into the EXPERIMENTS_LOG table.
#
# Normalization note: per_channel stats are RECOMPUTED from the train split
# at run start (dataset.py). Same seed 42 + same data config => identical
# train membership => numerically identical mean/std to world_v9_softcon, so
# the resumed backbone sees exactly the normalization it was trained under.
# No manual norm-stats copy required.
# ============================================================================
run_name: "world_v9_softcon_crt"

data:
  candidates_dir: data/rachel_geometry_candidates/candidates_world_v8_three_class
  parquet_source: data/rachel_geometry_candidates/all_countries/all_clusters_v4.parquet
  inspected_as_test: true
  include_unlabeled: true
  label_mode: three_class
  training_countries: [USA, BRA, CHL, MEX, THA]
  generalization_countries: [BGD, NGA]
  dmv_force_to_train_only: true

patches:
  patch_size_px: 128
  resolution_m: 10
  bands: [B2, B3, B4, B8, B11, B12]
  indices: [NDVI, NDBI, NDWI]
  composite: median
  date_range: ["2023-01-01", "2023-12-31"]
  max_cloud_cover: 15
  output_dir: data/patches
  num_workers: 16

model:
  # Must match world_v9_softcon (that's the backbone we're resuming from).
  architecture: resnet50_softcon
  hub_name: SENTINEL2_ALL_SOFTCON
  pretrained_band_order: [B1, B2, B3, B4, B5, B6, B7, B8, B8A, B9, B10, B11, B12]
  pretrained: true
  num_classes: 3
  input_channels: 9
  freeze_backbone_epochs: 999  # head-only for the whole run
  class_names: [NotFarm, Poultry, OtherFarm]
  class_colors: ["#95a5a6", "#e74c3c", "#3498db"]

training:
  epochs: 15
  batch_size: 32
  learning_rate: 0.00005
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 5
  checkpoint_metric: val_f1
  normalization: per_channel  # match world_v9_softcon (SoftCon z-scored input)
  dataloader_workers: 8
  val_split: 0.15
  test_split: 0.15
  seed: 42
  mixed_precision: true
  upsample_minority_regions: false
  balanced_country_splits: false
  balanced_class_sampling: true
  class_weight: null
  resume_from: data/output/world_v9_softcon/best_model.pt
  resume_optimizer_state: false
  resume_reset_epoch: true
  channel_subset: null  # match world_v9_softcon (all 9 channels)
  crop_center_px: 64
  augmentation:
    enabled: true
    horizontal_flip: { enabled: true, probability: 0.5 }
    vertical_flip: { enabled: true, probability: 0.5 }
    random_rotation_90: { enabled: true, probability: 0.75 }
    continuous_rotation: { enabled: true, probability: 0.3, max_degrees: 15 }
    random_resized_crop: { enabled: true, probability: 0.3, scale_min: 0.8, scale_max: 1.0 }
    brightness_jitter: { enabled: true, probability: 0.5, range_min: 0.85, range_max: 1.15 }
    per_band_jitter: { enabled: true, probability: 0.3, range_min: 0.95, range_max: 1.05 }
    gaussian_noise: { enabled: true, probability: 0.3, sigma: 0.02 }
    channel_dropout: { enabled: true, probability: 0.1, max_channels: 1 }
    cutout: { enabled: false }
    recompute_indices: false

mlflow:
  tracking_uri: ./mlruns
  experiment_name: world_v9_softcon_crt
  log_model: true

runpod:
  gpu_type: "NVIDIA A40"
  gpu_fallbacks:
    - "NVIDIA L4"
    - "NVIDIA L40"
    - "NVIDIA L40S"
    - "NVIDIA RTX A5000"
    - "NVIDIA RTX A6000"
    - "NVIDIA RTX 6000 Ada Generation"
    - "NVIDIA GeForce RTX 4090"
  cloud_type: "SECURE"
  docker_image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  volume_mount: /workspace
  code_dir: /workspace/farm-mapping
  github_repo: https://github.com/FilipZawadka/farm-mapping.git
  github_branch: more_cnn_tests
  api_key_env: RUNPOD_API_KEY
  network_volume_id: r8nyom4e4e
  cpu_instance_id: "cpu3g-8-32"
  cpu_fallbacks:
    - "cpu3g-4-16"
    - "cpu3c-8-16"
    - "cpu3m-4-32"
  auto_terminate: true

inference:
  checkpoint: data/output/world_v9_softcon_crt/best_model.pt
  threshold: 0.5
  labeled_only: true
  confidence_tiers:
    high: 0.9
    medium: 0.7
    low: 0.4

visualization:
  output_dir: output/maps_world_v9_softcon_crt
  show_true_positives: true
  show_false_positives: true
  show_false_negatives: true
  show_true_negatives: true
