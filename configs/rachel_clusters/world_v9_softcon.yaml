# ============================================================================
# world_v9_softcon -- v8_ssl4eo recipe + SoftCon Sentinel-2 backbone.
#
# Swaps SSL4EO-S12 MoCo ResNet-50 for SoftCon ResNet-50 (Wang et al. 2024,
# arXiv:2405.20462; zhu-xlab/softcon). Same lab's successor to the MoCo
# weights: soft-contrastive continual pretraining on SSL4EO-S12-ML. It tops
# the independent GEO-Bench m-EuroSAT 64px linear-probe table (80.0 vs ~70
# for the SSL4EO-lineage peers) and is the backbone behind Earth Genome's
# Earth Index poultry-CAFO search.
#
# Loaded via torchgeo's ResNet50_Weights.SENTINEL2_ALL_SOFTCON
# (torchgeo>=0.7.0; checkpoint B13_rn50_softcon.pth from HF wangyi111/softcon).
#
# Only the model + normalization differ from world_v8_ssl4eo; data/patches/
# candidates_dir/runpod are byte-identical so this run is directly comparable
# to the v8 table (same seed 42 + same data config => identical split
# membership; same imagery hash => reuses the existing patch store).
#
# Notes:
#   - pretrained_band_order is SoftCon's 13-band L1C order (same list as the
#     SSL4EO run); our channels are mapped onto it by NAME. NDVI/NDBI/NDWI and
#     the unused pretrained slices (B1/B5-B9/B10) are mean-init / dropped.
#   - normalization is "per_channel" (NOT "none"). Unlike MoCo (pretrained on
#     plain /10000-scaled reflectance), SoftCon's official transform is
#     per-band z-scoring, and its README endorses target-dataset mean/std.
#     Our per_channel path computes train-split mean/std, persists them to
#     splits/world_v9_softcon_norm_stats.json, and reapplies at inference.
#   - L1C(TOA)-pretrained vs our L2A patches: the first-order radiometric
#     shift is absorbed by target-stats z-scoring; SoftCon's own L2A
#     (BigEarthNet, no B10) benchmark results confirm transfer works.
#   - parquet_source bumped to v5: Rachel added an explicit `cnn_split_assigned`
#     column (train/val/test/eval/generalization/predict) that is now the
#     single source of truth for split membership -- see build_splits(). Same
#     cluster_id / patch store as v4 (verified 100% stable), so no re-extraction
#     needed; only the split assignment changed.
# ============================================================================
run_name: "world_v9_softcon"

data:
  candidates_dir: data/rachel_geometry_candidates/candidates_world_v8_three_class
  parquet_source: data/rachel_geometry_candidates/all_countries/all_clusters_v5.parquet
  inspected_as_test: true
  include_unlabeled: true
  label_mode: three_class
  training_countries: [USA, BRA, CHL, MEX, THA]
  generalization_countries: [BGD, NGA]
  dmv_force_to_train_only: true

patches:
  patch_size_px: 128
  resolution_m: 10
  bands: [B2, B3, B4, B8, B11, B12]
  indices: [NDVI, NDBI, NDWI]
  composite: median
  date_range: ["2023-01-01", "2023-12-31"]
  max_cloud_cover: 15
  output_dir: data/patches
  num_workers: 16

model:
  architecture: resnet50_softcon
  hub_name: SENTINEL2_ALL_SOFTCON
  pretrained_band_order: [B1, B2, B3, B4, B5, B6, B7, B8, B8A, B9, B10, B11, B12]
  pretrained: true
  num_classes: 3
  input_channels: 9
  freeze_backbone_epochs: 5
  class_names: [NotFarm, Poultry, OtherFarm]
  class_colors: ["#95a5a6", "#e74c3c", "#3498db"]

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 10
  checkpoint_metric: val_f1
  normalization: per_channel  # SoftCon expects per-band z-scored input, NOT /10000
  dataloader_workers: 8
  val_split: 0.15
  test_split: 0.15
  seed: 42
  mixed_precision: true
  upsample_minority_regions: false
  balanced_country_splits: false
  balanced_class_sampling: false
  class_weight: null
  channel_subset: null
  crop_center_px: 64
  augmentation:
    enabled: true
    horizontal_flip: { enabled: true, probability: 0.5 }
    vertical_flip: { enabled: true, probability: 0.5 }
    random_rotation_90: { enabled: true, probability: 0.75 }
    continuous_rotation: { enabled: true, probability: 0.3, max_degrees: 15 }
    random_resized_crop: { enabled: true, probability: 0.3, scale_min: 0.8, scale_max: 1.0 }
    brightness_jitter: { enabled: true, probability: 0.5, range_min: 0.85, range_max: 1.15 }
    per_band_jitter: { enabled: true, probability: 0.3, range_min: 0.95, range_max: 1.05 }
    gaussian_noise: { enabled: true, probability: 0.3, sigma: 0.02 }
    channel_dropout: { enabled: true, probability: 0.1, max_channels: 1 }
    cutout: { enabled: false }
    recompute_indices: false

mlflow:
  tracking_uri: ./mlruns
  experiment_name: world_v9_softcon
  log_model: true

runpod:
  gpu_type: "NVIDIA A40"
  gpu_fallbacks:
    - "NVIDIA L4"
    - "NVIDIA L40"
    - "NVIDIA L40S"
    - "NVIDIA RTX A5000"
    - "NVIDIA RTX A6000"
    - "NVIDIA RTX 6000 Ada Generation"
    - "NVIDIA GeForce RTX 4090"
  cloud_type: "SECURE"
  docker_image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  volume_mount: /workspace
  code_dir: /workspace/farm-mapping
  github_repo: https://github.com/FilipZawadka/farm-mapping.git
  github_branch: more_cnn_tests
  api_key_env: RUNPOD_API_KEY
  network_volume_id: r8nyom4e4e
  cpu_instance_id: "cpu3g-8-32"
  cpu_fallbacks:
    - "cpu3g-4-16"
    - "cpu3c-8-16"
    - "cpu3m-4-32"
  auto_terminate: true

inference:
  checkpoint: data/output/world_v9_softcon/best_model.pt
  threshold: 0.5
  labeled_only: true
  confidence_tiers:
    high: 0.9
    medium: 0.7
    low: 0.4

visualization:
  output_dir: output/maps_world_v9_softcon
  show_true_positives: true
  show_false_positives: true
  show_false_negatives: true
  show_true_negatives: true
