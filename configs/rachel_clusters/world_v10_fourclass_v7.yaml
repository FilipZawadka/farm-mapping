# ============================================================================
# world_v10_fourclass_v7 -- 4-class SoftCon retrained on Rachel's round_2 data.
#
# ONLY LEVER vs world_v10_fourclass_v6: the data (all_clusters_v7.parquet, built
# by scripts/merge_clusters_v7.py from the *_selected_clusters_round_2.parquet
# files). Model, optimiser, schedule, augmentation, crop and checkpoint metric
# are byte-identical to v6, so the comparison isolates the data change.
#
# What round_2 changes (verified, see docs/EXPERIMENTS_LOG.md 2026-07-30):
#   * +962 hard negatives promoted qual_eval -> train(770)/val(192), ALL NotFarm
#     (solar arrays, greenhouses / plastic crop covers) across 106 countries.
#     Train NotFarm 1,959 -> 2,750 (+40%); Poultry/Pigs/Cattle train counts
#     UNCHANGED, so farm-type separation is not diluted.
#   * 28 label corrections in the training countries.
#   * two new fully-labelled generalization countries: ALB (140) + COD (47).
#   * cluster_ids are 100% identical to v6 on identical geometry, so the patch
#     store is reused as-is -- no re-extraction, no re-keying.
#
# Balancing stays OFF (as in v6). NB: 44 train countries now have <=2 rows, and
# _compute_region_weights uses total/(n_countries*count) -- enabling
# upsample_minority_regions would draw a 1-row country ~102x per epoch. Do not
# turn that on without capping the weights.
# ============================================================================
run_name: world_v10_fourclass_v7
data:
  candidates_dir: data/rachel_geometry_candidates/candidates_world_v10_v7
  parquet_source: data/rachel_geometry_candidates/all_countries/all_clusters_v7.parquet
  inspected_as_test: true
  include_unlabeled: true
  label_mode: four_class
  training_countries:
  - USA
  - BRA
  - CHL
  - MEX
  - THA
  # NOTE: on the explicit-split path (cnn_split_assigned present) BOTH of these
  # lists are INERT -- verified by AST: the whitelist code lives only in the
  # legacy computed-split branch. Split membership comes solely from Rachel's
  # cnn_split_assigned. Listed here as documentation of intent.
  generalization_countries:
  - BGD
  - NGA
  - ALB
  - COD
  dmv_force_to_train_only: true
patches:
  patch_size_px: 128
  resolution_m: 10
  bands:
  - B2
  - B3
  - B4
  - B8
  - B11
  - B12
  indices:
  - NDVI
  - NDBI
  - NDWI
  composite: median
  date_range:
  - '2023-01-01'
  - '2023-12-31'
  max_cloud_cover: 15
  output_dir: data/patches
  num_workers: 16
model:
  architecture: resnet50_softcon
  hub_name: SENTINEL2_ALL_SOFTCON
  pretrained_band_order:
  - B1
  - B2
  - B3
  - B4
  - B5
  - B6
  - B7
  - B8
  - B8A
  - B9
  - B10
  - B11
  - B12
  pretrained: true
  num_classes: 4
  input_channels: 9
  freeze_backbone_epochs: 5
  class_names:
  - NotFarm
  - Poultry
  - Pigs
  - Cattle
  class_colors:
  - '#95a5a6'
  - '#e74c3c'
  - '#3498db'
  - '#27ae60'
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 10
  checkpoint_metric: val_f1
  normalization: per_channel
  dataloader_workers: 8
  val_split: 0.15
  test_split: 0.15
  seed: 42
  mixed_precision: true
  upsample_minority_regions: false
  balanced_country_splits: false
  balanced_class_sampling: false
  class_weight: null
  channel_subset: null
  crop_center_px: 64
  augmentation:
    enabled: true
    horizontal_flip:
      enabled: true
      probability: 0.5
    vertical_flip:
      enabled: true
      probability: 0.5
    random_rotation_90:
      enabled: true
      probability: 0.75
    continuous_rotation:
      enabled: true
      probability: 0.3
      max_degrees: 15
    random_resized_crop:
      enabled: true
      probability: 0.3
      scale_min: 0.8
      scale_max: 1.0
    brightness_jitter:
      enabled: true
      probability: 0.5
      range_min: 0.85
      range_max: 1.15
    per_band_jitter:
      enabled: true
      probability: 0.3
      range_min: 0.95
      range_max: 1.05
    gaussian_noise:
      enabled: true
      probability: 0.3
      sigma: 0.02
    channel_dropout:
      enabled: true
      probability: 0.1
      max_channels: 1
    cutout:
      enabled: false
    recompute_indices: false
mlflow:
  tracking_uri: ./mlruns
  experiment_name: world_v10_fourclass_softcon
  log_model: true
runpod:
  gpu_type: NVIDIA A40
  gpu_fallbacks:
  - NVIDIA L4
  - NVIDIA L40
  - NVIDIA L40S
  - NVIDIA RTX A5000
  - NVIDIA RTX A6000
  - NVIDIA RTX 6000 Ada Generation
  - NVIDIA GeForce RTX 4090
  cloud_type: SECURE
  docker_image: runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04
  volume_mount: /workspace
  code_dir: /workspace/farm-mapping
  github_repo: https://github.com/FilipZawadka/farm-mapping.git
  github_branch: more_cnn_tests
  api_key_env: RUNPOD_API_KEY
  network_volume_id: r8nyom4e4e
  cpu_instance_id: cpu3g-8-32
  cpu_fallbacks:
  - cpu3g-4-16
  - cpu3c-8-16
  - cpu3m-4-32
  auto_terminate: true
inference:
  checkpoint: data/output/world_v10_fourclass_v7/best_model.pt
  threshold: 0.5
  labeled_only: true
  confidence_tiers:
    high: 0.9
    medium: 0.7
    low: 0.4
visualization:
  output_dir: output/maps_world_v10_fourclass_softcon
  show_true_positives: true
  show_false_positives: true
  show_false_negatives: true
  show_true_negatives: true
